<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Just Cell It</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">
      <span class="bars"><span></span><span></span><span></span></span>
      Just Cell It
    </a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>
    <div class="header-controls" id="site-nav">
      <nav class="nav-links">
        <a href="catalog.html">Shop iPhones</a>
      </nav>
      <div class="nav-actions" id="nav-auth-slot"></div>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-side">
    <div class="eyebrow">
      <span class="bars"><span style="height:30%"></span><span style="height:60%"></span><span style="height:100%"></span></span>
      Welcome back
    </div>
    <h2>Pick up right where you left off.</h2>
    <p>Log in to see your orders and finish checking out.</p>
  </div>
  <div class="auth-form-wrap">
    <form class="auth-form" id="login-form" novalidate>
      <h1>Log in</h1>
      <p class="sub">Use the email and password you registered with.</p>

      <div class="alert alert-error" id="form-error"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      <div class="form-footer">Don't have an account? <a href="register.html" style="color: var(--accent)">Register</a></div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
