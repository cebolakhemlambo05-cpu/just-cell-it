<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create an account — Just Cell It</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">
      <span class="bars"><span></span><span></span><span></span></span>
      Just Cell It
    </a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>
    <div class="header-controls" id="site-nav">
      <nav class="nav-links">
        <a href="catalog.html">Shop iPhones</a>
      </nav>
      <div class="nav-actions" id="nav-auth-slot"></div>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-side">
    <div class="eyebrow">
      <span class="bars"><span style="height:30%"></span><span style="height:60%"></span><span style="height:100%"></span></span>
      Join Just Cell It
    </div>
    <h2>One account. Every order, tracked.</h2>
    <p>Registering lets us confirm your payment, keep a record of your order, and get in touch about delivery.</p>
  </div>
  <div class="auth-form-wrap">
    <form class="auth-form" id="register-form" novalidate>
      <h1>Create your account</h1>
      <p class="sub">Takes less than a minute.</p>

      <div class="alert alert-error" id="form-error"></div>
      <div class="alert alert-success" id="form-success"></div>

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
        <div class="hint">At least 8 characters.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      <div class="form-footer">Already have an account? <a href="login.html" style="color: var(--accent)">Log in</a></div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/register.js"></script>
</body>
</html>
